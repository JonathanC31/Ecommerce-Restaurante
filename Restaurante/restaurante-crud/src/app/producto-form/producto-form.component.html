<section class="producto-page">
  <div class="producto-card">
    <div class="producto-header">
      <div class="brand-icon">
        <i class="pi pi-box"></i>
      </div>

      <div>
        <h1>{{ edit ? 'Editar producto' : 'Nuevo producto' }}</h1>
        <p>
          Administra la información del menú, precios y disponibilidad de productos.
        </p>
      </div>
    </div>

    <form
      [formGroup]="formProducto"
      (ngSubmit)="edit ? updateProducto() : createProducto()"
      class="producto-form"
    >
      <div class="form-grid">
        <div class="form-group form-group-full">
          <label for="nombre">Nombre del producto</label>
          <input
            id="nombre"
            type="text"
            pInputText
            formControlName="nombre"
            placeholder="Ej: Arroz chino especial"
          />

          <small
            class="error"
            *ngIf="formProducto.get('nombre')?.invalid && formProducto.get('nombre')?.touched"
          >
            Nombre es requerido.
          </small>
        </div>

        <div class="form-group form-group-full">
          <label for="categoria">Categoría</label>
          <input
            id="categoria"
            type="text"
            pInputText
            formControlName="categoria"
            placeholder="Ej: Pollo, Comidas rápidas, Bebidas"
          />
        </div>

        <div class="form-group">
          <label for="precioUnitario">Precio unitario</label>
          <p-inputNumber
            inputId="precioUnitario"
            formControlName="precioUnitario"
            mode="currency"
            currency="COP"
            locale="es-CO"
            placeholder="0"
          ></p-inputNumber>
        </div>

        <div class="form-group form-group-full">
          <label for="imagen">Imagen del producto</label>
          <div class="image-upload-wrapper">
            <input
              id="imagen"
              type="file"
              accept="image/*"
              (change)="onFileSelected($event)"
              class="hidden-file-input"
              #fileInput
            />
            
            <div class="image-upload-zone" (click)="fileInput.click()">
              <div *ngIf="!imagePreviewUrl" class="upload-placeholder">
                <i class="pi pi-image text-4xl mb-2"></i>
                <span>Haz clic para seleccionar una foto</span>
                <span class="text-xs text-gray-500">(PNG, JPG o WEBP)</span>
              </div>
              
              <div *ngIf="imagePreviewUrl" class="image-preview-container">
                <img [src]="imagePreviewUrl" alt="Vista previa del plato" class="image-preview" />
                <div class="change-image-overlay">
                  <i class="pi pi-camera text-2xl mb-1"></i>
                  <span>Cambiar imagen</span>
                </div>
              </div>
            </div>
          </div>
        </div>

      </div>

      <div class="actions">
        <p-button
          [label]="edit ? 'Actualizar producto' : 'Guardar producto'"
          [loading]="isSaveInProgress"
          type="submit"
          icon="pi pi-save"
          styleClass="save-button"
        ></p-button>
      </div>
    </form>
  </div>
</section>
