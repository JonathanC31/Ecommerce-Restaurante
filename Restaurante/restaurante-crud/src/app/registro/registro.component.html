<p-toast></p-toast>

<section class="registro-page">
  <div class="registro-card">
    <div class="registro-header">
      <div class="brand-icon">
        <i class="pi pi-user-plus"></i>
      </div>

      <h1>Crea tu cuenta en Chow Yinn</h1>
      <p>
        Regístrate para guardar tus datos, realizar pedidos y disfrutar una mejor experiencia.
      </p>
    </div>

    <form [formGroup]="formUser" (ngSubmit)="onSubmit()" class="registro-form">
      <div class="form-grid">
        <div class="form-group">
          <label for="login">Usuario</label>
          <input
            type="text"
            pInputText
            id="login"
            formControlName="login"
            placeholder="Ingresa tu usuario"
          />
          <small
            class="error"
            *ngIf="formUser.get('login')?.invalid && formUser.get('login')?.touched"
          >
            Username es requerido.
          </small>
        </div>

        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input
            type="email"
            pInputText
            id="email"
            formControlName="email"
            placeholder="Ingresa tu correo"
          />
          <small
            class="error"
            *ngIf="formUser.get('email')?.invalid && formUser.get('email')?.touched"
          >
            Email válido es requerido.
          </small>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input
            type="password"
            pInputText
            id="password"
            formControlName="password"
            placeholder="Ingresa tu contraseña"
          />
          <small
            class="error"
            *ngIf="formUser.get('password')?.invalid && formUser.get('password')?.touched"
          >
            Password es requerido.
          </small>
        </div>

        <div class="form-group">
          <label for="name">Nombre</label>
          <input
            type="text"
            pInputText
            id="name"
            formControlName="name"
            placeholder="Ingresa tu nombre"
          />
          <small
            class="error"
            *ngIf="formUser.get('name')?.invalid && formUser.get('name')?.touched"
          >
            Nombre es requerido.
          </small>
        </div>

        <div class="form-group">
          <label for="phoneNumber">Teléfono</label>
          <input
            type="text"
            pInputText
            id="phoneNumber"
            formControlName="phoneNumber"
            placeholder="Ingresa tu teléfono"
          />
          <small
            class="error"
            *ngIf="formUser.get('phoneNumber')?.invalid && formUser.get('phoneNumber')?.touched"
          >
            Teléfono es requerido.
          </small>
        </div>

        <div class="form-group form-group-full">
          <label for="address">Dirección</label>
          <input
            type="text"
            pInputText
            id="address"
            formControlName="address"
            placeholder="Ingresa tu dirección"
          />
          <small
            class="error"
            *ngIf="formUser.get('address')?.invalid && formUser.get('address')?.touched"
          >
            Dirección es requerida.
          </small>
        </div>
      </div>

      <div class="actions">
        <p-button
          label="Guardar"
          type="submit"
          [loading]="isSaveInProgress"
          styleClass="save-button"
        ></p-button>

        <p-button
          label="Volver"
          type="button"
          routerLink="/login"
          styleClass="back-button"
        ></p-button>
      </div>
    </form>
  </div>
</section>
