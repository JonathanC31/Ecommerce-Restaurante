<div class="shell-page">
  <div class="shell-container">
    
    <!-- Topbar -->
    <header class="shell-header">
      <div class="header-brand">
        <div class="brand-icon">
          <i class="pi pi-home"></i>
        </div>
        <div class="brand-text">
          <p class="brand-title">Chow Yinn</p>
          <p class="brand-subtitle">Gestión contable, operativa y analítica</p>
        </div>
      </div>
      <div class="header-badge">
        <i class="pi pi-check-circle"></i>
        Datos seguros
      </div>
    </header>

    <!-- Content area -->
    <div class="shell-content">
      
      <!-- Sidebar -->
      <aside class="shell-sidebar">
        <p class="sidebar-title">Módulos</p>
        <nav class="sidebar-nav">
          <a *ngFor="let view of views"
             [routerLink]="view.path"
             [routerLinkActiveOptions]="{exact: view.exact}"
             routerLinkActive="active"
             class="nav-link">
            <div class="nav-icon">
              <i [class]="view.icon"></i>
            </div>
            <div class="nav-info">
              <span class="nav-group">{{ view.group }}</span>
              <span class="nav-label">{{ view.title }}</span>
            </div>
          </a>
        </nav>
        <div class="sidebar-info">
          <b>Contexto Colombia:</b> facturación electrónica DIAN, inventario trazable, reportes y control financiero.
        </div>
      </aside>

      <!-- Main router outlet -->
      <main class="shell-main">
        <router-outlet></router-outlet>
      </main>

    </div>
  </div>
</div>
