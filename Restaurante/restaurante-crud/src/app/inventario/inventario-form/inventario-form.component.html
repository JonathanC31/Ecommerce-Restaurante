<p-toast></p-toast>

<div class="inventario-form-container p-4 md:p-5">
  <div class="form-header flex justify-content-between align-items-center">
    <h2>{{ isEdit ? 'Editar Materia Prima' : 'Nueva Materia Prima' }}</h2>
    <p-button 
      label="Cancelar" 
      icon="pi pi-times" 
      routerLink="/inventario" 
      [text]="true"
      styleClass="btn-cancel">
    </p-button>
  </div>

  <form [formGroup]="form" (ngSubmit)="save()" class="p-fluid">
    <div class="grid">
      <div class="col-12 md:col-6 field">
        <label for="nombre">Nombre *</label>
        <input pInputText id="nombre" formControlName="nombre" placeholder="Ej: Arroz Blanco" />
        <small class="p-error block mt-1" *ngIf="form.get('nombre')?.invalid && form.get('nombre')?.touched">
          El nombre es requerido.
        </small>
      </div>

      <div class="col-12 md:col-6 field">
        <label for="categoria">Categoría</label>
        <input pInputText id="categoria" formControlName="categoria" placeholder="Ej: Granos" />
      </div>

      <div class="col-12 md:col-6 field">
        <label for="unidadMedida">Unidad de Medida *</label>
        <p-dropdown 
          id="unidadMedida" 
          [options]="unidadesMedida" 
          formControlName="unidadMedida" 
          placeholder="Seleccione unidad">
        </p-dropdown>
      </div>

      <div class="col-12 md:col-6 field">
        <label for="cantidadDisponible">Cantidad Disponible / Inicial *</label>
        <p-inputNumber 
          inputId="cantidadDisponible" 
          formControlName="cantidadDisponible" 
          mode="decimal" 
          [minFractionDigits]="0" 
          [maxFractionDigits]="2"
          [min]="0">
        </p-inputNumber>
      </div>

      <div class="col-12 md:col-6 field">
        <label for="stockMinimo">Stock Mínimo (Alerta) *</label>
        <p-inputNumber 
          inputId="stockMinimo" 
          formControlName="stockMinimo" 
          mode="decimal" 
          [minFractionDigits]="0" 
          [maxFractionDigits]="2"
          [min]="0">
        </p-inputNumber>
      </div>

      <div class="col-12 md:col-6 field">
        <label for="costoUnitario">Costo Unitario Promedio</label>
        <p-inputNumber 
          inputId="costoUnitario" 
          formControlName="costoUnitario" 
          mode="currency" 
          currency="COP" 
          locale="es-CO"
          [min]="0">
        </p-inputNumber>
      </div>

      <div class="col-12 md:col-6 field">
        <label for="proveedor">Proveedor</label>
        <input pInputText id="proveedor" formControlName="proveedor" placeholder="Nombre del proveedor" />
      </div>

      <div class="col-12 md:col-6 field">
        <label for="fechaVencimiento">Fecha de Vencimiento</label>
        <p-calendar 
          inputId="fechaVencimiento" 
          formControlName="fechaVencimiento" 
          dateFormat="yy-mm-dd" 
          [showIcon]="true">
        </p-calendar>
      </div>
    </div>

    <div class="flex justify-content-end mt-4 pt-4 border-top-1 border-200">
      <p-button 
        [label]="isEdit ? 'Actualizar' : 'Guardar'" 
        icon="pi pi-check" 
        type="submit" 
        [loading]="loading"
        styleClass="btn-submit">
      </p-button>
    </div>
  </form>
</div>
