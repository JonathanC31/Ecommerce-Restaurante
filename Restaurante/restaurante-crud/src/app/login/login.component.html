<section class="login-page">
  <div class="login-card">
    <div class="login-brand">
      <div class="brand-icon">
        <i class="pi pi-shop"></i>
      </div>

      <h1>Bienvenido a Chow Yinn</h1>
      <p>Inicia sesión para guardar tus preferencias o administrar el restaurante.</p>
    </div>

    <form class="login-form">
      <div class="form-group">
        <label for="username">Correo o usuario</label>
        <input
          pInputText
          [(ngModel)]="username"
          name="username"
          id="username"
          type="text"
          placeholder="Ingresa tu usuario"
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          pInputText
          [(ngModel)]="password"
          name="password"
          id="password"
          type="password"
          placeholder="Ingresa tu contraseña"
        />
      </div>

      <p-button
        label="Iniciar sesión"
        icon="pi pi-user"
        styleClass="login-button"
        (onClick)="onLogin()"
      ></p-button>

      <div class="register-box">
        <span>¿No tienes cuenta?</span>

        <p-button
          label="Crear cuenta"
          icon="pi pi-user-plus"
          styleClass="register-button"
          routerLink="/registro"
        ></p-button>
      </div>
    </form>
  </div>
</section>

<p-toast></p-toast>
