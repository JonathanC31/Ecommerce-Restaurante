<section class="login-page">
  <div class="login-card position-relative">
    <p-button 
        icon="pi pi-arrow-left" 
        [rounded]="true" 
        [text]="true" 
        severity="secondary" 
        routerLink="/home-user" 
        styleClass="absolute top-0 left-0 mt-3 ml-3 p-button-lg"
        title="Volver a la tienda">
    </p-button>

    <div class="login-brand">
      <div class="brand-icon">
        <i class="pi pi-shop"></i>
      </div>

      <h1>Bienvenido a Chow Yinn</h1>
      <p>Inicia sesión para guardar tus preferencias o administrar el restaurante.</p>
    </div>

    <form class="login-form">
      <div class="form-group">
        <label for="username">Correo o usuario</label>
        <input
          pInputText
          [(ngModel)]="username"
          name="username"
          id="username"
          type="text"
          placeholder="Ingresa tu usuario"
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          pInputText
          [(ngModel)]="password"
          name="password"
          id="password"
          type="password"
          placeholder="Ingresa tu contraseña"
        />
      </div>

      <p-button
        label="Iniciar sesión"
        icon="pi pi-user"
        styleClass="login-button"
        (onClick)="onLogin()"
      ></p-button>

      <div class="oauth-box text-center mt-3 mb-3">
        <a [href]="googleLoginUrl" class="p-button p-component p-button-outlined w-full flex justify-content-center align-items-center gap-2 no-underline">
          <i class="pi pi-google"></i>
          <span class="p-button-label">Continuar con Google</span>
        </a>
      </div>

      <div class="register-box">
        <span>¿No tienes cuenta?</span>

        <p-button
          label="Crear cuenta"
          icon="pi pi-user-plus"
          styleClass="register-button"
          routerLink="/registro"
        ></p-button>
      </div>
    </form>
  </div>
</section>

<p-toast></p-toast>
